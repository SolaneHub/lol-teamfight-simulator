name: Update LoL Patch Data

on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Target patch version (e.g. 16.17.1 or latest)'
        required: true
        default: 'latest'
      force_deploy:
        description: 'Force deploy even if reworks/manual review are detected'
        type: boolean
        default: false
  schedule:
    # Runs every Thursday morning at 06:00 UTC (typical Riot patch day)
    - cron: '0 6 * * 4'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  update-patch:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup .NET (Required for snip-snip)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unified LoL Data Pipeline
        id: patch_diff
        run: |
          $targetPatch = "${{ github.event.inputs.patch || 'latest' }}"
          node scripts/pipeline.cjs --to $targetPatch

      - name: Publish Diff Report to Action Summary
        if: always() && hashFiles('patch-diff-report.md') != ''
        run: |
          Get-Content patch-diff-report.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Patch Diff Report Artifact
        if: always() && hashFiles('patch-diff-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: patch-diff-report
          path: patch-diff-report.md
          retention-days: 30

      - name: Create GitHub Issue on Rework Detection
        if: steps.patch_diff.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('patch-diff-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Rework/Mechanic Changes Detected in Patch - Manual Review Required`,
              body: report,
              labels: ['patch-update', 'needs-review']
            });

      - name: Create Pull Request for Safe Patch Update
        if: steps.patch_diff.outputs.needs_review != 'true' && steps.patch_diff.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(patch): update LoL data & formulas [auto-diff safe]'
          branch: 'auto-patch-update'
          delete-branch: true
          title: '🚀 Safe Patch Update: LoL Data & Formulas'
          body-path: 'patch-diff-report.md'
          labels: 'automated-pr, patch-update'
