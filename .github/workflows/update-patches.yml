name: Auto Update LoL Patches & Spell Formulas

on:
  schedule:
    # Run every Wednesday at 06:00 UTC (LoL patch day)
    - cron: '0 6 * * 3'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-patches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Latest Riot Versions & Generate Formulas
        run: |
          # Fetch versions from Riot API
          VERSIONS_JSON=$(curl -s https://ddragon.leagueoflegends.com/api/versions.json)
          
          # Extract top 2 valid patch version strings (e.g., "16.15.1", "16.14.1")
          TOP_PATCHES=$(echo "$VERSIONS_JSON" | jq -r '.[] | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' | head -n 2)
          
          echo "Top active patches to process:"
          echo "$TOP_PATCHES"
          
          # Run formula generator for the latest patch as 'latest'
          LATEST_PATCH=$(echo "$TOP_PATCHES" | head -n 1)
          echo "----------------------------------------"
          echo "Processing latest patch ($LATEST_PATCH) as latest..."
          node scripts/generate-spell-formulas.cjs --patch "latest" || echo "Warning: failed for latest patch"
          
          # Run formula generator for the other 3 patches
          OTHER_PATCHES=$(echo "$TOP_PATCHES" | tail -n +2)
          for PATCH in $OTHER_PATCHES; do
            echo "----------------------------------------"
            echo "Processing patch $PATCH..."
            node scripts/generate-spell-formulas.cjs --patch "$PATCH" || echo "Warning: failed for patch $PATCH"
          done

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(auto): update LoL patch spell formulas [skip ci]"
          branch: main
          file_pattern: 'public/data/spellFormulas*.json'
